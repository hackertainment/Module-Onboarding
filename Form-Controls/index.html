<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- What is the customer's name? I must collect this data and ensure it contains at least two non-space characters. -->
        <div>
          <label>
            Name: <input type="text" id="name" name="name" placeholder="Forename Surname" pattern="\S.*\S" required />
          </label>          
        </div>
        <!-- What is the customer's email? I must make sure the email is valid. Email addresses follow a consistent pattern. -->
        <div>
          <label>
            Email: <input type="email" id="email" name="email" required />
          </label>
        </div>
        <!-- What colour should this T-shirt be? I must provide 3 options. How will I ensure they do not choose other colours? -->
        <div>
          Colour:
          <label>
            <input type="radio" id="colour_r" name="colour" value="R" required /><span style="background-color:#FFBBBB;">red</span>&nbsp;
          </label>
          <label>
            <input type="radio" id="colour_g" name="colour" value="G" required /><span style="background-color:#BBFFBB;">green</span>&nbsp;
          </label>
          <label>
            <input type="radio" id="colour_b" name="colour" value="B" required /><span style="background-color:#BBBBFF;">blue</span>&nbsp;
          </label>
        </div>
        <!-- What size does the customer want? I must provide the following 6 options: XS, S, M, L, XL, XXL -->
        <div>
          <label>
            Size: <select id="size" name="size">
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M" selected>M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
            </select>
          </label>
        </div>
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By WYATT LEE</p>
    </footer>
  </body>
</html>
